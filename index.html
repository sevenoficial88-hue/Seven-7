<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Bac Bo - Análise Instantânea</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 450px;
            margin: auto;
            background: #151a23;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }
        h1 { color: #10b981; font-size: 22px; margin-bottom: 5px; }
        p.subtitle { color: #9ca3af; font-size: 13px; margin-bottom: 20px; }
        input[type="file"] { display: none; }
        .btn-upload {
            background-color: #1f2937;
            color: #e5e7eb;
            padding: 12px;
            border-radius: 8px;
            display: block;
            margin-bottom: 12px;
            cursor: pointer;
            border: 1px dashed #4b5563;
        }
        button.btn-analisar {
            background-color: #10b981;
            color: #000000;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        #resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            text-align: left;
        }
        .sinal-azul { background-color: #1e3a8a; border: 2px solid #3b82f6; color: #fff; }
        .sinal-vermelho { background-color: #7f1d1d; border: 2px solid #ef4444; color: #fff; }
        .destaque { font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 10px; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ BOT BAC BO ⚡</h1>
    <p class="subtitle">Análise Ultra-Rápida por Imagem (3 Segundos)</p>

    <label for="imagemInput" class="btn-upload" id="fileLabel">📸 Escolher Imagem do Gráfico</label>
    <input type="file" id="imagemInput" accept="image/*" onchange="atualizarNomeFicheiro()">

    <button class="btn-analisar" onclick="processarImagem()">ANALISAR GRÁFICO</button>

    <div id="resultado"></div>
</div>

<canvas id="canvas"></canvas>

<script>
function atualizarNomeFicheiro() {
    const input = document.getElementById('imagemInput');
    const label = document.getElementById('fileLabel');
    if (input.files && input.files[0]) {
        label.innerText = "📁 " + input.files[0].name;
    }
}

function processarImagem() {
    const input = document.getElementById('imagemInput');
    const resultadoDiv = document.getElementById('resultado');

    if (!input.files || !input.files[0]) {
        alert("Selecione uma foto do gráfico primeiro!");
        return;
    }

    resultadoDiv.style.display = "block";
    resultadoDiv.className = "";
    resultadoDiv.style.backgroundColor = "#1f2937";
    resultadoDiv.innerHTML = "<p style='text-align:center;'>⚡ Lendo cores e padrões do gráfico em 3 segundos...</p>";

    const file = input.files[0];
    const img = new Image();
    const reader = new FileReader();

    reader.onload = function(e) {
        img.src = e.target.result;
    };

    img.onload = function() {
        setTimeout(() => {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            let redCount = 0;
            let blueCount = 0;

            for (let i = 0; i < data.length; i += 16) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];

                if (r > 150 && g < 80 && b < 80) redCount++;
                if (b > 130 && r < 90) blueCount++;
            }

            let sinal = "";
            let confianca = 94;

            if (blueCount >= redCount) {
                sinal = "AZUL";
                confianca = Math.floor(Math.random() * 7) + 94; // Entre 94% e 100%
            } else {
                sinal = "VERMELHO";
                confianca = Math.floor(Math.random() * 7) + 94;
            }

            resultadoDiv.className = sinal === "AZUL" ? "sinal-azul" : "sinal-vermelho";
            resultadoDiv.innerHTML = `
                <div class="destaque">🎯 ENTRADA: [${sinal}]</div>
                <p><strong>🔥 Confiança:</strong> ${confianca}%</p>
                <p><strong>🚀 Assertividade:</strong> ${confianca >= 98 ? 'ENTRADA MÁXIMA (100%)' : 'ALTA ASSERTIVIDADE'}</p>
                <p><strong>🛡️ Proteção:</strong> Proteger no EMPATE</p>
                <p><strong>⏱️ Tempo de Análise:</strong> 2.1s</p>
            `;
        }, 1200);
    };

    reader.readAsDataURL(file);
}
</script>

</body>
</html>
