<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEVEN-7 QUANTUM AI | BAC BO & AVIATOR PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #030712;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .bg-glow {
            position: fixed;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.08) 0%, rgba(3, 7, 18, 0.95) 70%);
            z-index: 0;
            pointer-events: none;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 450px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.2);
        }
        .header { text-align: center; margin-bottom: 15px; }
        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Mode Switcher Tabs */
        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(30, 41, 59, 0.6);
            padding: 5px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #9ca3af;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background: #10b981;
            color: #000;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
        .upload-area {
            border: 2px dashed rgba(16, 185, 129, 0.4);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            background: rgba(30, 41, 59, 0.5);
            cursor: pointer;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        .upload-area:hover { border-color: #10b981; background: rgba(16, 185, 129, 0.05); }
        input[type="file"] { display: none; }
        .btn-analyze {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 15px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        #resultCard {
            display: none;
            margin-top: 20px;
            border-radius: 14px;
            padding: 18px;
            animation: fadeIn 0.3s ease;
        }
        .card-blue { background: linear-gradient(135deg, rgba(30, 58, 138, 0.95), rgba(15, 23, 42, 0.95)); border: 2px solid #3b82f6; }
        .card-red { background: linear-gradient(135deg, rgba(127, 29, 29, 0.95), rgba(15, 23, 42, 0.95)); border: 2px solid #ef4444; }
        .card-aviator { background: linear-gradient(135deg, rgba(88, 28, 135, 0.95), rgba(15, 23, 42, 0.95)); border: 2px solid #a855f7; box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); }
        .card-wait { background: rgba(55, 65, 81, 0.9); border: 1px solid #9ca3af; text-align: center; }
        .signal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 12px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        canvas { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="bg-glow"></div>

<div class="container">
    <div class="header">
        <div class="title">SEVEN-7 QUANTUM AI</div>
    </div>

    <!-- Abas de Seleção de Jogo -->
    <div class="tab-container">
        <button class="tab-btn active" id="tabBacbo" onclick="mudarModo('bacbo')">🎲 BAC BO</button>
        <button class="tab-btn" id="tabAviator" onclick="mudarModo('aviator')">✈️ AVIATOR</button>
    </div>

    <label for="imagemInput" class="upload-area">
        <div id="uploadLabel">📸 Carregar Print do Gráfico (Bac Bo)</div>
    </label>
    <input type="file" id="imagemInput" accept="image/*" onchange="atualizarLabel()">

    <button class="btn-analyze" onclick="processarAnalise()">ANALISAR PADRÃO</button>

    <div id="resultCard"></div>
</div>

<canvas id="canvas"></canvas>

<script>
let modoAtual = 'bacbo';

function mudarModo(modo) {
    modoAtual = modo;
    const tabBacbo = document.getElementById('tabBacbo');
    const tabAviator = document.getElementById('tabAviator');
    const label = document.getElementById('uploadLabel');
    const card = document.getElementById('resultCard');

    card.style.display = 'none';

    if (modo === 'bacbo') {
        tabBacbo.classList.add('active');
        tabAviator.classList.remove('active');
        label.innerText = "📸 Carregar Print do Gráfico (Bac Bo)";
    } else {
        tabAviator.classList.add('active');
        tabBacbo.classList.remove('active');
        label.innerText = "📸 Carregar Print do Histórico de Velas (Aviator)";
    }
}

function atualizarLabel() {
    const input = document.getElementById('imagemInput');
    const label = document.getElementById('uploadLabel');
    if (input.files && input.files[0]) {
        label.innerText = "📁 " + input.files[0].name;
    }
}

function processarAnalise() {
    const input = document.getElementById('imagemInput');
    const card = document.getElementById('resultCard');

    if (!input.files || !input.files[0]) {
        alert("Carregue o print do jogo para realizar a análise!");
        return;
    }

    card.style.display = "block";
    card.className = "card-wait";
    card.innerHTML = `<p style='color:#10b981; font-weight:700;'>⚡ Analisando matriz de ${modoAtual.toUpperCase()} em 2.5s...</p>`;

    const file = input.files[0];
    const img = new Image();
    const reader = new FileReader();

    reader.onload = function(e) { img.src = e.target.result; };

    img.onload = function() {
        setTimeout(() => {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            if (modoAtual === 'bacbo') {
                analisarBacBo(data, card);
            } else {
                analisarAviator(data, card);
            }
        }, 1100);
    };

    reader.readAsDataURL(file);
}

// LÓGICA BAC BO
function analisarBacBo(data, card) {
    let redDots = 0;
    let blueDots = 0;

    for (let i = 0; i < data.length; i += 8) {
        let r = data[i], g = data[i + 1], b = data[i + 2];
        if (r > 170 && g < 60 && b < 70) redDots++;
        else if (b > 160 && r < 70 && g < 120) blueDots++;
    }

    if ((redDots + blueDots) < 30) {
        card.className = "card-wait";
        card.innerHTML = `<div class="signal-title" style="color:#f59e0b;">⚠️ GRÁFICO ILEGÍVEL</div><p style="font-size:12px;">Tire um print mais nítido da mesa do Bac Bo.</p>`;
        return;
    }

    let sinal = redDots >= blueDots ? "VERMELHO" : "AZUL";
    let padrao = redDots >= blueDots ? "Dominância Vermelha (Surf/Ciclo)" : "Dominância Azul (Surf/Ciclo)";
    let confianca = Math.floor(Math.random() * 4) + 95;

    card.className = sinal === "AZUL" ? "card-blue" : "card-red";
    card.innerHTML = `
        <div class="signal-title">🎯 ENTRADA BAC BO: [${sinal}]</div>
        <div class="info-row"><span>Assertividade:</span><strong style="color:#10b981;">${confianca}%</strong></div>
        <div class="info-row"><span>Padrão Lido:</span><strong>${padrao}</strong></div>
        <div class="info-row"><span>Proteção Obrigatória:</span><strong>EMPATE (Tie)</strong></div>
        <div class="info-row"><span>Gestão:</span><strong>Máximo Gale 1</strong></div>
    `;
}

// LÓGICA AVIATOR (Com Estratégia de Alvo Duplo)
function analisarAviator(data, card) {
    let velarAzuis = 0;   // Velas Baixas (< 2.00x)
    let velasRoxas = 0;   // Velas Médias (>= 2.00x)
    let velasRosas = 0;   // Velas Altas (>= 10.00x)

    for (let i = 0; i < data.length; i += 8) {
        let r = data[i], g = data[i + 1], b = data[i + 2];

        // Roxo/Rosa (Velas pagadoras)
        if (r > 140 && b > 140 && g < 100) velasRoxas++;
        else if (r > 200 && g < 100 && b > 150) velasRosas++;
        // Azul (Velas de recuperação / baixas)
        else if (b > 160 && r < 100) velarAzuis++;
    }

    let alvoSeguro = "1.50x";
    let alvoAlto = "3.50x - 5.00x";
    let padrao = "Recuperação de Velas Baixas";
    let confianca = Math.floor(Math.random() * 4) + 94;

    if (velasRoxas > velarAzuis) {
        alvoSeguro = "1.80x";
        alvoAlto = "5.00x - 8.00x";
        padrao = "Tendência de Velas Roxas (Pagador)";
    } else if (velasRosas > 5) {
        alvoSeguro = "2.00x";
        alvoAlto = "8.00x - 12.00x 🚀";
        padrao = "Ciclo de Alta Volatilidade (Rosa Próximo)";
    }

    card.className = "card-aviator";
    card.innerHTML = `
        <div class="signal-title">🚀 ENTRADA CONFIRMADA (AVIATOR)</div>
        <div class="info-row"><span>🛡️ Aposta 1 (Proteção):</span><strong style="color:#10b981; font-size:15px;">SAIR EM ${alvoSeguro}</strong></div>
        <div class="info-row"><span>🔥 Aposta 2 (Vela Alta):</span><strong style="color:#a855f7; font-size:15px;">ALVO ${alvoAlto}</strong></div>
        <div class="info-row"><span>Assertividade Calculada:</span><strong style="color:#10b981;">${confianca}%</strong></div>
        <div class="info-row"><span>Análise de Risco:</span><strong>${padrao}</strong></div>
        <div class="info-row"><span>Estratégia:</span><strong>Retire a Aposta 1 em ${alvoSeguro} para garantir a banca!</strong></div>
    `;
}
</script>

</body>
</html>
