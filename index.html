<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEVEN-7 QUANTUM AI | BAC BO PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #030712;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-x: hidden;
        }
        .bg-glow {
            position: fixed;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.08) 0%, rgba(3, 7, 18, 0.95) 70%);
            z-index: 0;
            pointer-events: none;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.15), inset 0 0 15px rgba(255, 255, 255, 0.02);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 3px 10px;
            border-radius: 20px;
            margin-top: 6px;
            text-transform: uppercase;
        }
        .upload-area {
            border: 2px dashed rgba(16, 185, 129, 0.3);
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            background: rgba(30, 41, 59, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }
        .upload-area:hover {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.05);
        }
        .upload-icon {
            font-size: 28px;
            margin-bottom: 5px;
        }
        .upload-text {
            font-size: 14px;
            color: #9ca3af;
            font-weight: 600;
        }
        input[type="file"] { display: none; }
        .btn-analyze {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 15px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: all 0.2s ease;
        }
        .btn-analyze:active {
            transform: scale(0.98);
        }
        #resultCard {
            display: none;
            margin-top: 20px;
            border-radius: 14px;
            padding: 18px;
            animation: fadeIn 0.4s ease;
        }
        .card-blue {
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.9), rgba(15, 23, 42, 0.95));
            border: 1px solid #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }
        .card-red {
            background: linear-gradient(135deg, rgba(127, 29, 29, 0.9), rgba(15, 23, 42, 0.95));
            border: 1px solid #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }
        .signal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 12px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .info-label { color: #9ca3af; }
        .info-value { font-weight: 700; color: #fff; }
        .guide-box {
            margin-top: 20px;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .guide-title {
            font-size: 12px;
            font-weight: 700;
            color: #10b981;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .guide-item {
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 4px;
        }
        canvas { display: none; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="bg-glow"></div>

<div class="container">
    <div class="header">
        <div class="title">SEVEN-7 QUANTUM AI</div>
        <div class="badge">Analisa Padrões em 2.5s</div>
    </div>

    <label for="imagemInput" class="upload-area">
        <div class="upload-icon">📸</div>
        <div class="upload-text" id="uploadLabel">Carregar Print do Gráfico</div>
    </label>
    <input type="file" id="imagemInput" accept="image/*" onchange="atualizarLabel()">

    <button class="btn-analyze" onclick="analisarMatriz()">PROCESSAR GRÁFICO</button>

    <div id="resultCard"></div>

    <div class="guide-box">
        <div class="guide-title">🛡️ Regras de Proteção de Banca</div>
        <div class="guide-item">• <strong>Proteção no Empate:</strong> Coloque sempre 10% da aposta no Tie.</div>
        <div class="guide-item">• <strong>Gale Máximo:</strong> No máximo 1 Martingale se necessário.</div>
        <div class="guide-item">• <strong>Meta Diária:</strong> Alcance 3 a 5 vitórias e encerre a sessão.</div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
function atualizarLabel() {
    const input = document.getElementById('imagemInput');
    const label = document.getElementById('uploadLabel');
    if (input.files && input.files[0]) {
        label.innerText = "📁 " + input.files[0].name;
    }
}

function analisarMatriz() {
    const input = document.getElementById('imagemInput');
    const card = document.getElementById('resultCard');

    if (!input.files || !input.files[0]) {
        alert("Por favor, selecione uma imagem do gráfico do Bac Bo!");
        return;
    }

    card.style.display = "block";
    card.className = "";
    card.style.background = "rgba(30, 41, 59, 0.8)";
    card.style.border = "1px solid #10b981";
    card.innerHTML = "<p style='text-align:center; font-weight:700; color:#10b981;'>⚡ Lendo matriz de cores em 2.5 segundos...</p>";

    const file = input.files[0];
    const img = new Image();
    const reader = new FileReader();

    reader.onload = function(e) { img.src = e.target.result; };

    img.onload = function() {
        setTimeout(() => {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            let redCount = 0;
            let blueCount = 0;

            for (let i = 0; i < data.length; i += 16) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];

                if (r > 150 && g < 80 && b < 80) redCount++;
                if (b > 130 && r < 90) blueCount++;
            }

            let sinal = "";
            let motivo = "";
            let confianca = Math.floor(Math.random() * 5) + 95; // 95% a 99%

            if (blueCount >= redCount) {
                sinal = "AZUL";
                motivo = "Tendência de Ciclo de Azul (Surf/Sequência)";
            } else {
                sinal = "VERMELHO";
                motivo = "Tendência de Ciclo de Vermelho (Surf/Sequência)";
            }

            card.className = sinal === "AZUL" ? "card-blue" : "card-red";
            card.innerHTML = `
                <div class="signal-title">🎯 ENTRADA: [${sinal}]</div>
                <div class="info-row"><span class="info-label">Probabilidade Calculada:</span><span class="info-value" style="color:#10b981;">${confianca}%</span></div>
                <div class="info-row"><span class="info-label">Padrão Identificado:</span><span class="info-value">${motivo}</span></div>
                <div class="info-row"><span class="info-label">Proteção Obrigatória:</span><span class="info-value">EMPATE (Tie)</span></div>
                <div class="info-row"><span class="info-label">Velocidade da Análise:</span><span class="info-value">2.1s</span></div>
            `;
        }, 1200);
    };

    reader.readAsDataURL(file);
}
</script>

</body>
</html>
